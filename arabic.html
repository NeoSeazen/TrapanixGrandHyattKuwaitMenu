    .swiper {
      width: 100%;

    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }

    .swiper-slide img {
      width: 100%;
      height: auto;
      object-fit: contain;
      max-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;

  <!-- Initialize Swiper -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const swiper = new Swiper('.swiper', {
        direction: 'horizontal',
        loop: false,
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        lazy: {
          loadPrevNext: true,
          loadOnTransitionStart: true
        },
        grabCursor: true,
        spaceBetween: 0,
        slidesPerView: 1,

    });
