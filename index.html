<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Menu | Language Selection</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Josefin Sans Light', sans-serif;
      background: url('images/Language.webp');
      background-repeat: no-repeat;         
      background-position: center center;    
      background-size: contain;
    }


    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      background-color: #9a8d68;
      color: #fdffee;
      border: none;
      border-radius: 8px;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      text-align-last: center;
      text-decoration: none;
    
    }

    .btn:hover {
      background-color: #444;
    
    }
  </style>
</head>
<body>
    <div class="buttons">
      <a href="english.html" class="btn">ENGLISH</a>
      <a href="arabic.html" class="btn">العربية</a>
    </div>
  </div>
</body>
</html>
